name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: vein-server
            env_var: VEIN_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" vein-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  healthcheck:
    name: The health check, the refresh, the backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            update.sh scripts/*.sh tests/*.sh

      - name: The health check goes by the game's answer, in the pinned image
        # tools/healthcheck.sh is healthy only on the server's reply to
        # A2S_INFO. Run in the pinned image, so its tools are proven there,
        # against a stand-in that answers, answers after a challenge, stays
        # silent, or is not there at all (tests/fixtures/fake-a2s.py). The real
        # server is the game job below.
        run: ./tests/e2e-healthcheck.sh

      - name: The refresh restarts only an empty server that is behind
        # A stand-in writes an app manifest and answers A2S with players,
        # behind the challenge, with nobody, or not at all. Players on and
        # silence must both leave it untouched, and silence must exit 1.
        run: ./tests/e2e-refresh.sh

      - name: A world goes out and comes back to the path the server reads
        # By path and by byte: every save file back at Vein/Saved/SaveGames,
        # nothing one level too deep, the previous world kept aside, and the
        # refusals leaving the world untouched.
        run: ./tests/e2e-backup-restore.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f vein-server-docker-compose.yml config >/dev/null
          echo "compose OK"

  game:
    name: The real server, and the health check asking it
    # The game is about 10 GB, small enough for every push. It is installed
    # the way a first start does, and the health check is proven against it
    # both ways: red while SteamCMD downloads and nothing is bound, green once
    # the server answers A2S_INFO, red with the server stopped by SIGSTOP
    # while the old /proc check stays green, green again after SIGCONT.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f vein-server-docker-compose.yml -p vein
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make room for the game
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Docker 29.4.2 answers socketcall with ENOSYS; give its daemon the profile 29.4.3 ships
        # SteamCMD is 32-bit and makes every socket through socketcall(2),
        # which Docker Engine 29.4.2 alone refuses (moby/moby#52506); the
        # ubuntu-26.04 runner ships it. On that version, and only there, the
        # daemon gets the default profile 29.4.3 ships (moby/profiles seccomp
        # v0.2.3), pinned by commit and checksum.
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          if [ "$v" != 29.4.2 ]; then echo "Docker $v: its own profile allows socketcall"; exit 0; fi
          sudo curl -fsSL -o /etc/docker/seccomp-29.4.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /etc/docker/seccomp-29.4.3.json" | sha256sum -c -
          f=/etc/docker/daemon.json
          [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"seccomp-profile": "/etc/docker/seccomp-29.4.3.json"}' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker

      - name: First start - the game is downloaded into the volume
        run: |
          cp .env.example .env
          sed -i "s/^VEIN_SERVER_ADMIN_PASSWORD=.*/VEIN_SERVER_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          docker volume create vein-server-data >/dev/null
          $COMPOSE up -d

      - name: While SteamCMD downloads, nothing is bound and the check is red
        run: |
          cid="$($COMPOSE ps -q vein-server)"
          sleep 45
          if docker exec "$cid" sh -c "grep -qs '^VeinServer' /proc/[0-9]*/comm"; then
            echo "the game is already running 45 s in; the download stage was too short to sample"
            exit 0
          fi
          n=0; out="$(docker exec "$cid" bash /healthcheck.sh 27015 2>&1)" || n=$?
          echo "45 s in, before the game runs: the check exits $n: $out"
          [ "$n" = 1 ] || { echo "::error::the check was not red before the game ran"; exit 1; }

      - name: Wait for the health check to go green
        run: |
          cid="$($COMPOSE ps -q vein-server)"
          for _ in $(seq 1 180); do
            s="$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
            [ "$s" = healthy ] && { echo "health: $s"; docker exec "$cid" bash /healthcheck.sh 27015; exit 0; }
            [ "$s" = unhealthy ] && break
            sleep 10
          done
          echo "::error::the server never reported healthy"
          $COMPOSE logs --tail 80
          echo "--- the health check's own words, last runs"
          docker inspect "$cid" --format '{{range .State.Health.Log}}exit {{.ExitCode}}: {{.Output}}{{end}}' | tail -c 2000
          echo "--- UDP sockets in the container"
          docker exec "$cid" cat /proc/net/udp
          exit 1

      - name: Plant - the process that answers, stopped, keeps the old check green and turns this one red
        # The check up to v1.0.3 was VeinServer in /proc. SIGSTOP on the process that
        # owns the port's UDP socket (tests/fixtures/port-owner.sh; a name match
        # is not enough, LinuxGSM's tmux carries the game's name and stopping it
        # stops nothing that answers) leaves every process there and nothing
        # answering: the old check must still pass and this one fail; after
        # SIGCONT this one passes again.
        run: |
          cid="$($COMPOSE ps -q vein-server)"
          # The owners are visible only to their own user; try every uid here.
          uids="$(docker exec "$cid" sh -c 'cat /proc/[0-9]*/status 2>/dev/null' | awk '/^Uid:/ { print $2 }' | sort -u)"
          own=""; as=""
          for u in $uids; do
            own="$(docker exec -u "$u" -i "$cid" sh -s 27015 < tests/fixtures/port-owner.sh 2>/dev/null)" && { as="$u"; break; }
          done
          [ -n "$own" ] || { echo "::error::no user in the container can see who owns UDP 27015"; docker exec "$cid" cat /proc/net/udp; exit 1; }
          echo "UDP 27015 is owned by (pid uid comm), as seen by uid $as:"; echo "$own"
          pids="$(awk '{ print $1 }' <<<"$own" | tr '\n' ' ')"
          docker exec -u "$as" "$cid" sh -c "kill -STOP $pids"
          st="$(docker exec "$cid" sh -c "for p in $pids; do cut -d' ' -f3 /proc/\$p/stat; done" | tr '\n' ' ')"
          o=0; docker exec "$cid" sh -c "grep -qs '^VeinServer' /proc/[0-9]*/comm" || o=$?
          n=0; out="$(docker exec "$cid" bash /healthcheck.sh 27015 2>&1)" || n=$?
          if [ "$n" = 0 ]; then
            echo "--- the check stayed green with the owners stopped; who answered:"
            docker exec -i "$cid" sh -s 27015 < tests/fixtures/udp-diag.sh || true
          fi
          docker exec -u "$as" "$cid" sh -c "kill -CONT $pids"
          echo "owners stopped (states: $st): the old check exits $o, the new one $n: $out"
          [ "$o" = 0 ] && [ "$n" = 1 ] || { echo "::error::expected the old check to pass (0) and the new one to fail (1)"; exit 1; }
          for _ in $(seq 1 30); do
            docker exec "$cid" bash /healthcheck.sh 27015 && exit 0
            sleep 2
          done
          echo "::error::the game did not answer again after SIGCONT"; exit 1

      - name: Stop
        if: always()
        run: |
          $COMPOSE down -t 60 >/dev/null 2>&1 || true
          docker volume rm -f vein-server-data >/dev/null 2>&1 || true
