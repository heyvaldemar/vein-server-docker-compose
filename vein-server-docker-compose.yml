# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. Set VEIN_SERVER_IMAGE_VERSION in .env to run a different version
# while the digest for it is fetched normally, or VEIN_SERVER_IMAGE_TAG to
# replace the whole reference. CI (the Trivy scan and check-pin-freshness)
# reads the pin from this line: this block is the single source of truth.
#
# THE IMAGE IS THE WRAPPER, NOT THE GAME. mbround18/vein-docker brings
# SteamCMD and a start script; the game itself, Steam app 2131400, is
# downloaded into the volume below on the first start and brought up to date
# on every start after it. A new image tag is a change to the scripts, not a
# VEIN patch. VEIN patches arrive through scripts/refresh.sh.
x-images:
  vein-server: &vein-server-image ${VEIN_SERVER_IMAGE_TAG:-mbround18/vein-docker:${VEIN_SERVER_IMAGE_VERSION:-v0.0.4@sha256:a571282f29a237ab7185a5521315ef48111353220428701fed1e2a6093a5c116}}

services:
  vein-server:
    image: *vein-server-image
    # NO PASSWORD IN THE LOGS. The image prints its start command and, after
    # the server exits, the command lines of processes left behind, and the
    # engine writes its own command line to stdout ("LogInit: Command Line:").
    # Everything the image prints passes through sed on its way to
    # `docker compose logs`, and any Password=value there reads Password=******.
    # The pattern is in the filter, the value is not, so it is on no command
    # line. tests/secret-probe.sh proves no value reaches the logs.
    entrypoint:
      - /bin/bash
      - -c
      - exec /entrypoint.sh > >(exec sed -u -E 's/(Password=)[^ "]*/\1******/Ig') 2>&1
    # Handles untrusted input from the internet and cannot gain privileges
    # through a setuid binary. Here that also matters for a second reason: the
    # image gives its steam user passwordless sudo, and with no-new-privileges
    # sudo cannot raise anything. The start script's own sudo calls then do
    # nothing, which costs nothing, because the volume below already belongs
    # to the steam user.
    security_opt:
      - no-new-privileges:true
    # AN UNREAL ENGINE 5 SERVER, SIZED BY THE SLOT COUNT. On the machine this
    # template comes from it idled at 3.3 GB with one player on, and ran 16
    # slots under an 8 GB ceiling, then 32 under 16 GB. Raise the two
    # together. The ceiling exists so a leak here cannot get some other
    # container killed instead, and there is no swap on top of it, because a
    # game tick that pages is a stutter every player sees.
    deploy:
      resources:
        limits:
          memory: ${VEIN_SERVER_MEMORY_LIMIT:-8g}
          cpus: "${VEIN_SERVER_CPU_LIMIT:-4.0}"
        reservations:
          memory: ${VEIN_SERVER_MEMORY_RESERVATION:-4g}
          cpus: "${VEIN_SERVER_CPU_RESERVATION:-1.0}"
    memswap_limit: ${VEIN_SERVER_MEMORY_LIMIT:-8g}
    ports:
      # PUBLISHED UNDER THE NUMBERS THEY BIND, NEVER TRANSLATED. The server is
      # told both ports below and advertises them to Steam itself; map 8888 on
      # the host to 7777 in the container and Steam lists a port nobody can
      # reach. Change a port by changing the variable, which moves both sides.
      - "${VEIN_SERVER_PORT:-7777}:${VEIN_SERVER_PORT:-7777}/udp"
      # The query port: the server browser, and how scripts/refresh.sh asks a
      # public server how many players are on. VEIN answers it only as a
      # public server (VEIN_SERVER_PUBLIC=true); private, it is bound and
      # silent, so the health check asks the game port instead.
      - "${VEIN_SERVER_QUERY_PORT:-27015}:${VEIN_SERVER_QUERY_PORT:-27015}/udp"
    environment:
      SERVER_NAME: ${VEIN_SERVER_NAME:-VEIN Server}
      # THE SERVER IS STARTED BY tools/start-server.sh, NOT THE IMAGE'S LINE.
      # The image passes both passwords as arguments, where every process in
      # the container, `ps` on the host and the engine's log can read them.
      # The start script writes the join password into Game.ini instead, and
      # the passwords reach the container under names the image does not use.
      START_COMMAND: exec bash /start-server.sh
      # Empty means anyone who finds the server can join.
      VEIN_JOIN_PASSWORD: ${VEIN_SERVER_PASSWORD:-}
      # Optional. The game reads it only from its command line, so set, it is
      # visible there (README). Admins by Steam id below need no password.
      VEIN_ADMIN_PASSWORD: ${VEIN_SERVER_ADMIN_PASSWORD:-}
      ADMIN_STEAM_IDS: ${VEIN_SERVER_ADMIN_STEAM_IDS:-}
      SUPERADMIN_STEAM_IDS: ${VEIN_SERVER_SUPERADMIN_STEAM_IDS:-}
      MAX_PLAYERS: ${VEIN_SERVER_MAX_PLAYERS:-16}
      SERVER_PORT: ${VEIN_SERVER_PORT:-7777}
      QUERY_PORT: ${VEIN_SERVER_QUERY_PORT:-27015}
      SERVER_PUBLIC: ${VEIN_SERVER_PUBLIC:-false}
      # SteamCMD brings the game up to date on every start, so a restart is
      # an update. scripts/refresh.sh relies on exactly that, and only
      # restarts an empty server whose build is behind Steam's.
      UPDATE_ON_START: "true"
      # The world is written on the way out, inside stop_grace_period below.
      SAVE_ON_SHUTDOWN: "true"
      # VEIN saves on its own every 60 seconds and keeps ten rotating files.
      # That autosave is what makes a backup of a running server safe: VEIN
      # has no rcon to ask for a save first. See scripts/backup.sh.
      AUTOSAVE_ENABLED: "1"
      AUTOSAVE_INTERVAL: "60"
      AUTOSAVE_MAX_QUANTITY: "10"
      TZ: ${VEIN_SERVER_TIMEZONE:-UTC}
    volumes:
      # The whole install: about 10 GB of game files SteamCMD manages and can
      # download again, and under Vein/Saved the one thing it cannot, the world
      # and its settings. scripts/backup.sh archives only Vein/Saved, and
      # scripts/restore.sh puts it back at exactly that path.
      - vein-server-data:/home/steam/vein
      # The health check: a SteamNetworkingSockets challenge to the game port
      # (see healthcheck: below).
      - ./tools/healthcheck.sh:/healthcheck.sh:ro
      # The start: the join password into Game.ini, no password as an argument.
      - ./tools/start-server.sh:/start-server.sh:ro
    healthcheck:
      # THE GAME'S OWN ANSWER, NOT ITS PROCESS. tools/healthcheck.sh sends the
      # first packet a client sends, a SteamNetworkingSockets ChallengeRequest,
      # to the game port and is healthy only on the server's reply carrying
      # back the check's own connection id. A private server, the default,
      # never answers A2S, so a check on the query port would be red forever.
      # Up to v1.0.3 this looked for VeinServer in /proc, which a hung or
      # stopped server keeps; CI stops it with SIGSTOP and requires red. Not
      # the log either: an empty server writes nothing. While SteamCMD
      # downloads the game nothing is bound to the game port, so the check is
      # red then, as it must be. Each check ends within 7 seconds and opens no
      # connection (CI asks thirty times and requires no new log line and no
      # file written). It asks from inside the container: it does not prove
      # the ports are published on the host or open in a firewall.
      test: ["CMD", "bash", "/healthcheck.sh", "${VEIN_SERVER_PORT:-7777}"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the whole game; later ones update it.
      start_period: ${VEIN_SERVER_START_PERIOD:-60m}
    # Long enough for the save the image performs before it stops. A SIGKILL
    # in the middle of it is a world that loads from the last autosave, or
    # does not load.
    stop_grace_period: ${VEIN_SERVER_STOP_GRACE_PERIOD:-2m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${VEIN_SERVER_LOG_MAX_SIZE:-10m}
        max-file: "${VEIN_SERVER_LOG_MAX_FILE:-3}"

# DECLARED EXTERNAL SO `docker compose down -v` CANNOT DELETE IT.
#
# `down -v` is the command everybody reaches for when a stack misbehaves. On a
# project-managed volume it removes the world without asking, and the game
# files with it. As an external volume compose mounts it and refuses to create
# or destroy it. Create it before the first start:
#
#   docker volume create vein-server-data
#
# Removing it is then a deliberate act that names the thing being destroyed.
volumes:
  vein-server-data:
    name: vein-server-data
    external: true
